# Publica el frontend (React) en GitHub Pages.
# Configuración única: Settings > Pages > Source = "GitHub Actions".
# Variables del repositorio (Settings > Secrets and variables > Actions > Variables):
#   VITE_API_BASE_URL        URL pública del backend (la URL de Cloud Run)
#   VITE_LANDAI_CONTACT_URL  (opcional) destino del botón "Habla con Land AI"
name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_LANDAI_CONTACT_URL: ${{ vars.VITE_LANDAI_CONTACT_URL }}
          # Con el repositorio "landai-change" la base es /landai-change/ (sin dominio propio).
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
